    <script>
      const observer = new MutationObserver((mutations) => {
        document.querySelectorAll('img').forEach(img => {
          // If the image source points to the root /images/ instead of the repository folder
          if (img.src.includes(window.location.origin + '/images/')) {
            img.src = img.src.replace('/images/', '/south-spice/images/');
          }
        });
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
